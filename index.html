<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Studio Web - Professional Painting Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        csp: {
                            bg: '#1e1e1e',
                            panel: '#2a2a2a',
                            border: '#3c3c3c',
                            hover: '#3a3a3a',
                            active: '#007acc',
                            text: '#cccccc',
                            textMuted: '#858585',
                            accent: '#0e639c'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }
        .checkerboard {
            background-image: 
                linear-gradient(45deg, #2b2b2b 25%, transparent 25%), 
                linear-gradient(-45deg, #2b2b2b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2b2b2b 75%), 
                linear-gradient(-45deg, transparent 75%, #2b2b2b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="bg-csp-bg text-csp-text h-screen w-screen flex flex-col overflow-hidden select-none font-sans">

    <header class="bg-csp-panel border-b border-csp-border h-9 flex items-center px-3 justify-between z-30 flex-shrink-0">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 text-csp-text font-bold">
                <i class="fa-solid fa-palette text-blue-400"></i>
                <span class="tracking-wide">CLIP STUDIO WEB PRO</span>
            </div>
            <nav class="flex items-center space-x-1 text-csp-textMuted text-[11px]">
                <div class="relative group cursor-pointer px-2 py-1 hover:bg-csp-hover hover:text-white rounded">
                    ファイル
                    <div class="absolute left-0 top-full hidden group-hover:block bg-csp-panel border border-csp-border shadow-lg py-1 w-48 z-50">
                        <div onclick="app.newCanvas()" class="px-3 py-1.5 hover:bg-csp-active hover:text-white flex justify-between cursor-pointer"><span>新規キャンバス</span><span class="text-csp-textMuted">Ctrl+N</span></div>
                        <div onclick="document.getElementById('image-upload-input').click()" class="px-3 py-1.5 hover:bg-csp-active hover:text-white flex justify-between cursor-pointer"><span>画像をレイヤーとして読込</span><span class="text-csp-textMuted">Ctrl+O</span></div>
                        <div onclick="app.exportImage('png')" class="px-3 py-1.5 hover:bg-csp-active hover:text-white flex justify-between cursor-pointer"><span>PNG形式で保存</span><span class="text-csp-textMuted">Ctrl+S</span></div>
                        <div onclick="app.exportImage('jpeg')" class="px-3 py-1.5 hover:bg-csp-active hover:text-white cursor-pointer">JPEG形式で保存</div>
                    </div>
                </div>
                <input type="file" id="image-upload-input" accept="image/*" class="hidden">
                <div class="relative group cursor-pointer px-2 py-1 hover:bg-csp-hover hover:text-white rounded">
                    編集
                    <div class="absolute left-0 top-full hidden group-hover:block bg-csp-panel border border-csp-border shadow-lg py-1 w-44 z-50">
                        <div onclick="app.undo()" class="px-3 py-1.5 hover:bg-csp-active hover:text-white flex justify-between cursor-pointer"><span>元に戻す (Undo)</span><span class="text-csp-textMuted">Ctrl+Z</span></div>
                        <div onclick="app.redo()" class="px-3 py-1.5 hover:bg-csp-active hover:text-white flex justify-between cursor-pointer"><span>やり直し (Redo)</span><span class="text-csp-textMuted">Ctrl+Y</span></div>
                    </div>
                </div>
                <div class="relative group cursor-pointer px-2 py-1 hover:bg-csp-hover hover:text-white rounded">
                    表示
                    <div class="absolute left-0 top-full hidden group-hover:block bg-csp-panel border border-csp-border shadow-lg py-1 w-44 z-50">
                        <div onclick="app.resetView()" class="px-3 py-1.5 hover:bg-csp-active hover:text-white cursor-pointer">表示リセット (100%)</div>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Quick Toolbar Stats / Canvas status -->
        <div class="flex items-center space-x-4 text-csp-textMuted text-xs">
            <span id="canvas-info-dims">1000 × 1000 px</span>
            <span id="canvas-info-zoom">100%</span>
            <button onclick="app.toggleFullScreen()" class="hover:text-white px-2 py-1 bg-csp-border rounded cursor-pointer" title="全画面"><i class="fa-solid fa-expand"></i></button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">

        <!-- Left Toolbar (Tools) -->
        <aside class="w-14 bg-csp-panel border-r border-csp-border flex flex-col items-center py-2 space-y-1 z-20 flex-shrink-0">
            <button onclick="app.setTool('pen')" id="tool-pen" title="ペン" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-pen-nib text-base"></i></button>
            <button onclick="app.setTool('pencil')" id="tool-pencil" title="鉛筆" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-pencil text-base"></i></button>
            <button onclick="app.setTool('brush')" id="tool-brush" title="水彩筆" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-paintbrush text-base"></i></button>
            <button onclick="app.setTool('airbrush')" id="tool-airbrush" title="エアブラシ" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-spray-can text-base"></i></button>
            <button onclick="app.setTool('eraser')" id="tool-eraser" title="消しゴム" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-eraser text-base"></i></button>
            
            <div class="w-8 h-[1px] bg-csp-border my-1"></div>

            <button onclick="app.setTool('line')" id="tool-line" title="直線" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-slash text-base"></i></button>
            <button onclick="app.setTool('rect')" id="tool-rect" title="四角形" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-regular fa-square text-base"></i></button>
            <button onclick="app.setTool('circle')" id="tool-circle" title="正円/楕円" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-regular fa-circle text-base"></i></button>
            <button onclick="app.setTool('fill')" id="tool-fill" title="塗りつぶし" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-fill-drip text-base"></i></button>
            
            <div class="w-8 h-[1px] bg-csp-border my-1"></div>

            <button onclick="app.setTool('eyedropper')" id="tool-eyedropper" title="スポイト" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-eye-dropper text-base"></i></button>
            <button onclick="app.setTool('move')" id="tool-move" title="移動（レイヤー/画像移動）" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><i class="fa-solid fa-arrows-up-down-left-right text-base"></i></button>
            <button onclick="app.setTool('hand')" id="tool-hand" title="手のひら（カンバス移動）" class="w-10 h-10 rounded flex items-center justify-center text-csp-text hover:bg-csp-hover transition cursor-pointer"><span class="font-bold text-sm">✋</span></button>
        </aside>

        <!-- Center Canvas Viewport -->
        <main id="viewport" class="flex-1 checkerboard relative overflow-hidden flex items-center justify-center cursor-crosshair">
            <!-- Canvas Container for Zoom/Pan Transformation -->
            <div id="canvas-container" class="relative shadow-2xl transition-transform duration-75 origin-center" style="width: 1000px; height: 1000px;">
                <!-- Layers rendered dynamically here -->
            </div>

            <!-- Floating On-Screen Navigation/Zoom controller -->
            <div class="absolute bottom-4 left-4 bg-csp-panel/90 backdrop-blur border border-csp-border rounded-lg px-3 py-2 flex items-center space-x-3 shadow-lg z-10 text-csp-text">
                <button onclick="app.zoom(-0.1)" class="w-6 h-6 hover:bg-csp-hover rounded flex items-center justify-center cursor-pointer" title="縮小"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <span id="zoom-level-indicator" class="w-12 text-center font-mono text-xs">100%</span>
                <button onclick="app.zoom(0.1)" class="w-6 h-6 hover:bg-csp-hover rounded flex items-center justify-center cursor-pointer" title="拡大"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <div class="w-[1px] h-4 bg-csp-border"></div>
                <button onclick="app.rotateCanvas(-15)" class="w-6 h-6 hover:bg-csp-hover rounded flex items-center justify-center cursor-pointer" title="左回転"><i class="fa-solid fa-rotate-left"></i></button>
                <span id="rotate-level-indicator" class="w-10 text-center font-mono text-xs">0°</span>
                <button onclick="app.rotateCanvas(15)" class="w-6 h-6 hover:bg-csp-hover rounded flex items-center justify-center cursor-pointer" title="右回転"><i class="fa-solid fa-rotate-right"></i></button>
                <button onclick="app.resetView()" class="px-2 py-1 bg-csp-border hover:bg-csp-hover rounded text-[10px] cursor-pointer">リセット</button>
            </div>
        </main>

        <aside class="w-80 bg-csp-panel border-l border-csp-border flex flex-col z-20 overflow-hidden flex-shrink-0">
            
            <!-- Brush Property Panel -->
            <div class="border-b border-csp-border p-3 space-y-3">
                <div class="flex items-center justify-between font-semibold text-white text-xs">
                    <span id="active-tool-title"><i class="fa-solid fa-pen-nib mr-1.5 text-blue-400"></i> ブラシ設定</span>
                    <span id="active-tool-name-badge" class="text-[10px] bg-csp-accent px-1.5 py-0.5 rounded text-white font-mono">PEN</span>
                </div>
                <div class="space-y-2 text-xs">
                    <div>
                        <div class="flex justify-between text-csp-textMuted mb-1">
                            <span>ブラシサイズ</span>
                            <span id="brush-size-val">15 px</span>
                        </div>
                        <input type="range" id="brush-size" min="1" max="150" value="15" class="w-full h-1.5 bg-csp-border rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-csp-textMuted mb-1">
                            <span>不透明度</span>
                            <span id="brush-opacity-val">100%</span>
                        </div>
                        <input type="range" id="brush-opacity" min="1" max="100" value="100" class="w-full h-1.5 bg-csp-border rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Image Transform & Adjustment Panel -->
            <div id="image-transform-panel" class="border-b border-csp-border p-3 space-y-2 bg-csp-bg/30">
                <div class="flex items-center justify-between font-semibold text-white text-xs">
                    <span><i class="fa-solid fa-image mr-1.5 text-cyan-400"></i> 画像・レイヤー変形</span>
                    <button onclick="app.fitImageToCanvas()" class="px-2 py-0.5 bg-csp-border hover:bg-csp-hover rounded text-[10px] cursor-pointer">キャンバスに合わせる</button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-[11px]">
                    <div>
                        <span class="text-csp-textMuted block mb-0.5">拡大縮小 (%)</span>
                        <input type="range" id="transform-scale" min="10" max="300" value="100" class="w-full h-1.5 bg-csp-border rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <span class="text-csp-textMuted block mb-0.5">回転 (度)</span>
                        <input type="range" id="transform-rotate" min="-180" max="180" value="0" class="w-full h-1.5 bg-csp-border rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
                <div class="flex space-x-2 pt-1">
                    <button onclick="app.applyTransform()" class="flex-1 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium text-[11px] cursor-pointer">変形を確定</button>
                    <button onclick="app.cancelTransform()" class="flex-1 py-1 bg-csp-border hover:bg-csp-hover rounded text-white text-[11px] cursor-pointer">キャンセル</button>
                </div>
            </div>

            <!-- Color Palette & Color Picker Panel -->
            <div class="border-b border-csp-border p-3 space-y-3">
                <div class="flex items-center justify-between font-semibold text-white text-xs">
                    <span><i class="fa-solid fa-palette mr-1.5 text-pink-400"></i> カラー</span>
                    <button onclick="app.swapColors()" title="描画色/背景色入替" class="px-2 py-0.5 bg-csp-border hover:bg-csp-hover rounded text-[10px] cursor-pointer">入替</button>
                </div>
                
                <div class="flex items-center space-x-3">
                    <div class="relative w-10 h-10 flex-shrink-0 cursor-pointer">
                        <div id="primary-color-preview" class="absolute top-0 left-0 w-7 h-7 rounded border-2 border-white shadow-md z-10" style="background-color: #000000;"></div>
                        <div id="secondary-color-preview" class="absolute bottom-0 right-0 w-7 h-7 rounded border border-csp-border bg-white z-0"></div>
                    </div>
                    <div class="flex-1 flex items-center space-x-2">
                        <input type="color" id="color-picker-input" value="#000000" class="w-8 h-8 rounded border-0 bg-transparent cursor-pointer">
                        <input type="text" id="color-hex-input" value="#000000" class="flex-1 bg-csp-bg border border-csp-border rounded px-2 py-1 text-white font-mono uppercase text-center text-xs">
                    </div>
                </div>

                <!-- Quick Swatches -->
                <div class="grid grid-cols-8 gap-1 pt-1">
                    <div onclick="app.setPrimaryColor('#000000')" class="w-full h-5 rounded cursor-pointer bg-black border border-csp-border hover:scale-105 transition"></div>
                    <div onclick="app.setPrimaryColor('#ffffff')" class="w-full h-5 rounded cursor-pointer bg-white border border-csp-border hover:scale-105 transition"></div>
                    <div onclick="app.setPrimaryColor('#ff3b30')" class="w-full h-5 rounded cursor-pointer bg-red-500 border border-csp-border hover:scale-105 transition"></div>
                    <div onclick="app.setPrimaryColor('#ff9500')" class="w-full h-5 rounded cursor-pointer bg-orange-500 border border-csp-border hover:scale-105 transition"></div>
                    <div onclick="app.setPrimaryColor('#ffcc00')" class="w-full h-5 rounded cursor-pointer bg-yellow-400 border border-csp-border hover:scale-105 transition"></div>
                    <div onclick="app.setPrimaryColor('#34c759')" class="w-full h-5 rounded cursor-pointer bg-green-500 border border-csp-border hover:scale-105 transition"></div>
                    <div onclick="app.setPrimaryColor('#007aff')" class="w-full h-5 rounded cursor-pointer bg-blue-500 border border-csp-border hover:scale-105 transition"></div>
                    <div onclick="app.setPrimaryColor('#af52de')" class="w-full h-5 rounded cursor-pointer bg-purple-500 border border-csp-border hover:scale-105 transition"></div>
                </div>
            </div>

            <!-- Layer Panel -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="p-3 border-b border-csp-border flex items-center justify-between bg-csp-panel">
                    <span class="font-semibold text-white text-xs"><i class="fa-solid fa-layer-group mr-1.5 text-amber-400"></i> レイヤー</span>
                    <div class="flex items-center space-x-1">
                        <button onclick="app.addLayer()" title="新規レイヤー" class="w-6 h-6 bg-csp-border hover:bg-csp-active text-white rounded flex items-center justify-center cursor-pointer text-xs"><i class="fa-solid fa-plus"></i></button>
                        <button onclick="app.duplicateLayer()" title="レイヤー複製" class="w-6 h-6 bg-csp-border hover:bg-csp-active text-white rounded flex items-center justify-center cursor-pointer text-xs"><i class="fa-solid fa-copy"></i></button>
                        <button onclick="app.mergeDownLayer()" title="下のレイヤーと結合" class="w-6 h-6 bg-csp-border hover:bg-csp-active text-white rounded flex items-center justify-center cursor-pointer text-xs"><i class="fa-solid fa-down-long"></i></button>
                        <button onclick="app.deleteLayer()" title="レイヤー削除" class="w-6 h-6 bg-csp-border hover:bg-red-600 text-white rounded flex items-center justify-center cursor-pointer text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <!-- Blend mode & Opacity controls for active layer -->
                <div class="p-2 border-b border-csp-border bg-csp-bg/50 flex items-center space-x-2">
                    <select id="layer-blend-mode" class="flex-1 bg-csp-panel border border-csp-border text-white rounded px-2 py-1 text-[11px] outline-none cursor-pointer">
                        <option value="source-over">通常</option>
                        <option value="multiply">乗算</option>
                        <option value="screen">スクリーン</option>
                        <option value="overlay">オーバーレイ</option>
                        <option value="darken">比較(暗)</option>
                        <option value="lighten">比較(明)</option>
                    </select>
                    <div class="flex items-center space-x-1 w-24">
                        <span class="text-csp-textMuted text-[10px]">不透明</span>
                        <input type="range" id="layer-opacity-range" min="0" max="100" value="100" class="w-full h-1.5 bg-csp-border rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <!-- Layer List Container -->
                <div id="layer-list" class="flex-1 overflow-y-auto p-1 space-y-1">
                    <!-- Layer items generated dynamically -->
                </div>
            </div>

        </aside>

    </div>

    <div id="new-canvas-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-csp-panel border border-csp-border rounded-lg p-6 w-96 shadow-2xl space-y-4">
            <h3 class="text-white font-bold text-sm flex items-center"><i class="fa-solid fa-file-circle-plus text-blue-400 mr-2"></i> 新規キャンバス作成</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-csp-textMuted block mb-1">プリセット</label>
                    <select id="modal-preset" class="w-full bg-csp-bg border border-csp-border rounded px-2 py-1.5 text-white cursor-pointer">
                        <option value="1920x1080">Full HD (1920 x 1080)</option>
                        <option value="1000x1000" selected>スクエア (1000 x 1000)</option>
                        <option value="800x600">SVGA (800 x 600)</option>
                        <option value="2000x1500">高解像度 (2000 x 1500)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-csp-textMuted block mb-1">幅 (px)</label>
                        <input type="number" id="modal-width" value="1000" class="w-full bg-csp-bg border border-csp-border rounded px-2 py-1 text-white font-mono">
                    </div>
                    <div>
                        <label class="text-csp-textMuted block mb-1">高さ (px)</label>
                        <input type="number" id="modal-height" value="1000" class="w-full bg-csp-bg border border-csp-border rounded px-2 py-1 text-white font-mono">
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2 text-xs">
                <button onclick="app.closeNewCanvasModal()" class="px-4 py-1.5 bg-csp-border hover:bg-csp-hover text-white rounded cursor-pointer">キャンセル</button>
                <button onclick="app.confirmNewCanvas()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded font-medium cursor-pointer">作成</button>
            </div>
        </div>
    </div>

    <!-- Notification Message Toast -->
    <div id="toast-message" class="fixed bottom-6 right-6 bg-csp-panel border border-csp-border text-white px-4 py-2 rounded-lg shadow-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2 text-xs">
        <i class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-text">保存しました</span>
    </div>

    <script>
        class ClipStudioApp {
            constructor() {
                this.width = 1000;
                this.height = 1000;
                this.zoomLevel = 1.0;
                this.rotateAngle = 0;
                this.panX = 0;
                this.panY = 0;
                
                this.layers = [];
                this.activeLayerId = null;
                
                this.currentTool = 'pen';
                this.primaryColor = '#000000';
                this.secondaryColor = '#ffffff';
                this.brushSize = 15;
                this.brushOpacity = 1.0;
                
                this.isDrawing = false;
                this.isPanning = false;
                this.isLayerMoving = false;
                this.startX = 0;
                this.startY = 0;
                this.lastX = 0;
                this.lastY = 0;
                
                this.history = [];
                this.historyIndex = -1;
                this.maxHistory = 20;

                this.tempCanvas = null;
                this.tempCtx = null;
                this.transformData = null;
                
                // Move tool support properties
                this.layerStartX = 0;
                this.layerStartY = 0;

                this.init();
            }

            init() {
                this.setupDOM();
                this.initTempCanvas();
                this.createNewCanvas(this.width, this.height);
                this.setupEventListeners();
                this.updateToolUI();
            }

            updateToolUI() {
                document.querySelectorAll('aside button').forEach(b => {
                    if(b.id && b.id.startsWith('tool-')) b.classList.remove('bg-csp-active', 'text-white');
                });
                const activeBtn = document.getElementById(`tool-${this.currentTool}`);
                if(activeBtn) activeBtn.classList.add('bg-csp-active', 'text-white');
            }

            setupDOM() {
                this.container = document.getElementById('canvas-container');
                this.viewport = document.getElementById('viewport');
                
                document.getElementById('image-upload-input').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        this.importImageAsLayer(file);
                    }
                    e.target.value = '';
                });

                document.getElementById('brush-size').addEventListener('input', (e) => {
                    this.brushSize = parseInt(e.target.value);
                    document.getElementById('brush-size-val').innerText = this.brushSize + ' px';
                });
                document.getElementById('brush-opacity').addEventListener('input', (e) => {
                    this.brushOpacity = parseInt(e.target.value) / 100;
                    document.getElementById('brush-opacity-val').innerText = e.target.value + '%';
                });

                document.getElementById('transform-scale').addEventListener('input', (e) => {
                    if (this.transformData) {
                        this.transformData.scale = parseInt(e.target.value) / 100;
                        this.renderTransformPreview();
                    }
                });
                document.getElementById('transform-rotate').addEventListener('input', (e) => {
                    if (this.transformData) {
                        this.transformData.rotate = parseInt(e.target.value);
                        this.renderTransformPreview();
                    }
                });

                const colorInput = document.getElementById('color-picker-input');
                const colorHex = document.getElementById('color-hex-input');
                
                colorInput.addEventListener('input', (e) => {
                    this.setPrimaryColor(e.target.value);
                });
                colorHex.addEventListener('change', (e) => {
                    if(/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                        this.setPrimaryColor(e.target.value);
                    }
                });

                document.getElementById('modal-preset').addEventListener('change', (e) => {
                    const [w, h] = e.target.value.split('x').map(Number);
                    document.getElementById('modal-width').value = w;
                    document.getElementById('modal-height').value = h;
                });

                document.getElementById('layer-blend-mode').addEventListener('change', (e) => {
                    const layer = this.getActiveLayer();
                    if(layer) {
                        layer.blendMode = e.target.value;
                        layer.canvas.style.mixBlendMode = e.target.value;
                    }
                });
                document.getElementById('layer-opacity-range').addEventListener('input', (e) => {
                    const layer = this.getActiveLayer();
                    if(layer) {
                        layer.opacity = parseInt(e.target.value) / 100;
                        layer.canvas.style.opacity = layer.opacity;
                        this.updateLayerUI();
                    }
                });
            }

            createNewCanvas(w, h) {
                this.width = w;
                this.height = h;
                
                if (this.container) {
                    this.container.innerHTML = '';
                }
                
                this.layers = [];
                this.history = [];
                this.historyIndex = -1;
                this.transformData = null;
                
                this.container.style.width = w + 'px';
                this.container.style.height = h + 'px';
                
                this.addLayer('用紙', true, '#ffffff');
                this.addLayer('レイヤー 1', false);
                
                this.resetView();
                this.saveState();
                this.closeNewCanvasModal();
                this.showToast(`新規キャンバス (${w}x${h}px)`);
            }

            initTempCanvas() {
                this.tempCanvas = document.createElement('canvas');
                this.tempCanvas.width = 3000;
                this.tempCanvas.height = 3000;
                this.tempCtx = this.tempCanvas.getContext('2d', { willReadFrequently: true });
            }

            importImageAsLayer(file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        this.addLayer(file.name.substring(0, 15), false);
                        const layer = this.getActiveLayer();
                        if (!layer) return;

                        const cW = this.width;
                        const cH = this.height;
                        const iW = img.width;
                        const iH = img.height;

                        const scale = Math.min(cW / iW, cH / iH, 1.0);
                        const targetW = iW * scale;
                        const targetH = iH * scale;
                        const offsetX = (cW - targetW) / 2;
                        const offsetY = (cH - targetH) / 2;

                        layer.ctx.drawImage(img, offsetX, offsetY, targetW, targetH);
                        
                        this.transformData = {
                            img: img,
                            origW: iW,
                            origH: iH,
                            scale: scale,
                            rotate: 0,
                            x: offsetX,
                            y: offsetY,
                            layerId: layer.id
                        };

                        document.getElementById('transform-scale').value = Math.round(scale * 100);
                        document.getElementById('transform-rotate').value = 0;

                        this.updateLayerUI();
                        this.saveState();
                        this.showToast(`画像を読み込みました`);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            renderTransformPreview() {
                if (!this.transformData) return;
                const layer = this.layers.find(l => l.id === this.transformData.layerId);
                if (!layer) return;

                layer.ctx.clearRect(0, 0, this.width, this.height);
                layer.ctx.save();
                
                const t = this.transformData;
                const drawW = t.origW * t.scale;
                const drawH = t.origH * t.scale;
                const centerX = t.x + drawW / 2;
                const centerY = t.y + drawH / 2;

                layer.ctx.translate(centerX, centerY);
                layer.ctx.rotate((t.rotate * Math.PI) / 180);
                layer.ctx.drawImage(t.img, -drawW / 2, -drawH / 2, drawW, drawH);
                
                layer.ctx.restore();
                this.updateLayerUI();
            }

            fitImageToCanvas() {
                if (!this.transformData) return;
                const t = this.transformData;
                const scale = Math.min(this.width / t.origW, this.height / t.origH);
                t.scale = scale;
                t.rotate = 0;
                t.x = (this.width - t.origW * scale) / 2;
                t.y = (this.height - t.origH * scale) / 2;

                document.getElementById('transform-scale').value = Math.round(scale * 100);
                document.getElementById('transform-rotate').value = 0;
                this.renderTransformPreview();
            }

            applyTransform() {
                this.transformData = null;
                this.saveState();
                this.showToast('変形を確定しました');
            }

            cancelTransform() {
                this.transformData = null;
                this.undo();
                this.showToast('変形をキャンセルしました');
            }

            addLayer(name = null, isPaper = false, fillColor = null) {
                const id = 'layer_' + Date.now() + Math.random().toString(36).substring(2, 5);
                const layerName = name || `レイヤー ${this.layers.length + 1}`;
                
                const canvas = document.createElement('canvas');
                canvas.width = this.width;
                canvas.height = this.height;
                canvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
                
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                if (fillColor) {
                    ctx.fillStyle = fillColor;
                    ctx.fillRect(0, 0, this.width, this.height);
                }

                this.container.appendChild(canvas);

                const layerObj = {
                    id,
                    name: layerName,
                    canvas,
                    ctx,
                    visible: true,
                    opacity: 1.0,
                    blendMode: 'source-over',
                    isPaper
                };

                this.layers.push(layerObj);
                this.setActiveLayer(id);
                this.updateLayerOrderDOM();
                this.updateLayerUI();
            }

            updateLayerOrderDOM() {
                this.layers.forEach(layer => {
                    this.container.appendChild(layer.canvas);
                });
            }

            getActiveLayer() {
                return this.layers.find(l => l.id === this.activeLayerId);
            }

            setActiveLayer(id) {
                this.activeLayerId = id;
                this.updateLayerUI();
                const layer = this.getActiveLayer();
                if(layer) {
                    document.getElementById('layer-blend-mode').value = layer.blendMode;
                    document.getElementById('layer-opacity-range').value = Math.round(layer.opacity * 100);
                }
            }

            deleteLayer() {
                if (this.layers.length <= 1) {
                    this.showToast('レイヤーを削除できません', true);
                    return;
                }
                const index = this.layers.findIndex(l => l.id === this.activeLayerId);
                if (index !== -1) {
                    this.container.removeChild(this.layers[index].canvas);
                    this.layers.splice(index, 1);
                    this.setActiveLayer(this.layers[Math.max(0, index - 1)].id);
                    this.updateLayerUI();
                    this.saveState();
                }
            }

            duplicateLayer() {
                const layer = this.getActiveLayer();
                if(!layer) return;

                const id = 'layer_' + Date.now() + Math.random().toString(36).substring(2, 5);
                const canvas = document.createElement('canvas');
                canvas.width = this.width;
                canvas.height = this.height;
                canvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
                
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(layer.canvas, 0, 0);

                this.container.appendChild(canvas);

                const newLayer = {
                    id,
                    name: layer.name + ' のコピー',
                    canvas,
                    ctx,
                    visible: layer.visible,
                    opacity: layer.opacity,
                    blendMode: layer.blendMode,
                    isPaper: false
                };

                const index = this.layers.findIndex(l => l.id === this.activeLayerId);
                this.layers.splice(index + 1, 0, newLayer);
                this.setActiveLayer(id);
                this.updateLayerOrderDOM();
                this.updateLayerUI();
                this.saveState();
            }

            mergeDownLayer() {
                const index = this.layers.findIndex(l => l.id === this.activeLayerId);
                if (index <= 0) {
                    this.showToast('下のレイヤーと結合できません', true);
                    return;
                }
                const upper = this.layers[index];
                const lower = this.layers[index - 1];

                lower.ctx.globalAlpha = upper.opacity;
                lower.ctx.globalCompositeOperation = upper.blendMode;
                lower.ctx.drawImage(upper.canvas, 0, 0);
                lower.ctx.globalAlpha = 1.0;
                lower.ctx.globalCompositeOperation = 'source-over';

                this.container.removeChild(upper.canvas);
                this.layers.splice(index, 1);
                this.setActiveLayer(lower.id);
                this.updateLayerUI();
                this.saveState();
                this.showToast('レイヤーを結合しました');
            }

            toggleLayerVisibility(id, e) {
                e.stopPropagation();
                const layer = this.layers.find(l => l.id === id);
                if (layer) {
                    layer.visible = !layer.visible;
                    layer.canvas.style.display = layer.visible ? 'block' : 'none';
                    this.updateLayerUI();
                }
            }

            updateLayerUI() {
                const listEl = document.getElementById('layer-list');
                listEl.innerHTML = '';

                [...this.layers].reverse().forEach(layer => {
                    const isActive = layer.id === this.activeLayerId;
                    const item = document.createElement('div');
                    item.className = `flex items-center justify-between p-2 rounded cursor-pointer border ${isActive ? 'bg-csp-active/20 border-csp-active text-white' : 'bg-csp-panel border-csp-border hover:bg-csp-hover text-csp-text'}`;
                    item.onclick = () => this.setActiveLayer(layer.id);

                    item.innerHTML = `
                        <div class="flex items-center space-x-2 truncate">
                            <button onclick="app.toggleLayerVisibility('${layer.id}', event)" class="w-5 h-5 flex items-center justify-center text-csp-textMuted hover:text-white cursor-pointer">
                                <i class="fa-solid ${layer.visible ? 'fa-eye' : 'fa-eye-slash text-red-400'}"></i>
                            </button>
                            <div class="w-6 h-6 bg-csp-bg border border-csp-border rounded overflow-hidden flex-shrink-0 relative checkerboard">
                                <canvas class="w-full h-full object-contain" id="thumb_${layer.id}"></canvas>
                            </div>
                            <span class="truncate font-medium text-xs">${layer.name}</span>
                        </div>
                        <div class="text-[10px] text-csp-textMuted font-mono">${Math.round(layer.opacity * 100)}%</div>
                    `;
                    listEl.appendChild(item);
                    
                    setTimeout(() => {
                        const thumbCanvas = document.getElementById(`thumb_${layer.id}`);
                        if(thumbCanvas) {
                            const tCtx = thumbCanvas.getContext('2d');
                            thumbCanvas.width = 24;
                            thumbCanvas.height = 24;
                            tCtx.drawImage(layer.canvas, 0, 0, 24, 24);
                        }
                    }, 50);
                });

                document.getElementById('canvas-info-dims').innerText = `${this.width} × ${this.height} px`;
            }

            setTool(toolName) {
                this.currentTool = toolName;
                document.querySelectorAll('aside button').forEach(b => {
                    if(b.id && b.id.startsWith('tool-')) b.classList.remove('bg-csp-active', 'text-white');
                });
                const activeBtn = document.getElementById(`tool-${toolName}`);
                if(activeBtn) activeBtn.classList.add('bg-csp-active', 'text-white');
                
                const names = {
                    pen: ['ペン', 'PEN'],
                    pencil: ['鉛筆', 'PENCIL'],
                    brush: ['水彩筆', 'BRUSH'],
                    airbrush: ['エアブラシ', 'AIRBRUSH'],
                    eraser: ['消しゴム', 'ERASER'],
                    line: ['直線', 'LINE'],
                    rect: ['四角形', 'RECT'],
                    circle: ['円', 'CIRCLE'],
                    fill: ['塗りつぶし', 'FILL'],
                    eyedropper: ['スポイト', 'PICKER'],
                    move: ['移動', 'MOVE'],
                    hand: ['手のひら', 'HAND']
                };
                document.getElementById('active-tool-title').innerHTML = `<i class="fa-solid fa-pen-nib mr-1.5 text-blue-400"></i> ${names[toolName][0]}設定`;
                document.getElementById('active-tool-name-badge').innerText = names[toolName][1];
            }

            setPrimaryColor(hex) {
                this.primaryColor = hex;
                document.getElementById('primary-color-preview').style.backgroundColor = hex;
                document.getElementById('color-picker-input').value = hex;
                document.getElementById('color-hex-input').value = hex.toUpperCase();
            }

            swapColors() {
                const temp = this.primaryColor;
                this.setPrimaryColor(this.secondaryColor);
                this.secondaryColor = temp;
                document.getElementById('secondary-color-preview').style.backgroundColor = this.secondaryColor;
            }

            setupEventListeners() {
                this.viewport.addEventListener('mousedown', (e) => this.onPointerDown(e));
                window.addEventListener('mousemove', (e) => this.onPointerMove(e));
                window.addEventListener('mouseup', () => this.onPointerUp());

                this.viewport.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        const touch = e.touches[0];
                        this.onPointerDown({ clientX: touch.clientX, clientY: touch.clientY, button: 0 });
                    }
                });
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1) {
                        const touch = e.touches[0];
                        this.onPointerMove({ clientX: touch.clientX, clientY: touch.clientY });
                    }
                });
                window.addEventListener('touchend', () => this.onPointerUp());

                this.viewport.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.1 : -0.1;
                    this.zoom(delta);
                }, { passive: false });
            }

            getCanvasCoords(e) {
                const layer = this.getActiveLayer();
                if (!layer) return { x: 0, y: 0 };
                
                const rect = layer.canvas.getBoundingClientRect();
                const scaleX = this.width / rect.width;
                const scaleY = this.height / rect.height;
                
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            onPointerDown(e) {
                const layer = this.getActiveLayer();
                if (!layer && this.currentTool !== 'hand') return;

                const coords = this.getCanvasCoords(e);
                this.isDrawing = true;
                this.startX = coords.x;
                this.startY = coords.y;
                this.lastX = coords.x;
                this.lastY = coords.y;

                if (this.currentTool === 'hand' || e.button === 1 || e.shiftKey) {
                    this.isPanning = true;
                    this.isDrawing = false;
                    this.panStartX = e.clientX - this.panX;
                    this.panStartY = e.clientY - this.panY;
                    return;
                }

                if (this.currentTool === 'move') {
                    this.isDrawing = false;
                    this.isLayerMoving = true;
                    this.layerStartX = coords.x;
                    this.layerStartY = coords.y;
                    
                    // Create a backup snapshot of current active layer to translate smoothly
                    this.tempCtx.clearRect(0, 0, this.width, this.height);
                    this.tempCtx.drawImage(layer.canvas, 0, 0);
                    return;
                }

                if (this.currentTool === 'eyedropper') {
                    this.pickColor(coords.x, coords.y);
                    this.isDrawing = false;
                    return;
                }

                if (this.currentTool === 'fill') {
                    this.floodFill(Math.floor(coords.x), Math.floor(coords.y));
                    this.isDrawing = false;
                    this.saveState();
                    return;
                }

                if (['line', 'rect', 'circle'].includes(this.currentTool)) {
                    this.tempCtx.clearRect(0, 0, this.width, this.height);
                    this.tempCtx.drawImage(layer.canvas, 0, 0);
                }
            }

            onPointerMove(e) {
                if (this.isPanning) {
                    this.panX = e.clientX - this.panStartX;
                    this.panY = e.clientY - this.panStartY;
                    this.updateTransform();
                    return;
                }

                if (this.isLayerMoving) {
                    const coords = this.getCanvasCoords(e);
                    const layer = this.getActiveLayer();
                    if (!layer) return;

                    const dx = coords.x - this.layerStartX;
                    const dy = coords.y - this.layerStartY;

                    layer.ctx.clearRect(0, 0, this.width, this.height);
                    layer.ctx.save();
                    layer.ctx.drawImage(this.tempCanvas, dx, dy);
                    layer.ctx.restore();
                    this.updateLayerUI();
                    return;
                }

                if (!this.isDrawing) return;

                const coords = this.getCanvasCoords(e);
                const layer = this.getActiveLayer();
                if (!layer) return;

                const ctx = layer.ctx;

                if (['pen', 'pencil', 'brush', 'airbrush', 'eraser'].includes(this.currentTool)) {
                    ctx.save();
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.globalAlpha = this.brushOpacity;

                    if (this.currentTool === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.strokeStyle = 'rgba(0,0,0,1)';
                        ctx.lineWidth = this.brushSize;
                        ctx.beginPath();
                        ctx.moveTo(this.lastX, this.lastY);
                        ctx.lineTo(coords.x, coords.y);
                        ctx.stroke();
                    } else if (this.currentTool === 'airbrush') {
                        ctx.fillStyle = this.primaryColor;
                        const density = 20;
                        for (let i = 0; i < density; i++) {
                            const offsetX = (Math.random() - 0.5) * this.brushSize;
                            const offsetY = (Math.random() - 0.5) * this.brushSize;
                            if (offsetX * offsetX + offsetY * offsetY <= (this.brushSize / 2) * (this.brushSize / 2)) {
                                ctx.fillRect(coords.x + offsetX, coords.y + offsetY, 1, 1);
                            }
                        }
                    } else {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = this.primaryColor;
                        ctx.fillStyle = this.primaryColor;
                        
                        if (this.currentTool === 'pencil') {
                            ctx.lineWidth = Math.max(1, this.brushSize * 0.5);
                            ctx.setLineDash([2, 2]);
                        } else if (this.currentTool === 'brush') {
                            ctx.lineWidth = this.brushSize;
                            ctx.globalAlpha = this.brushOpacity * 0.6;
                        } else {
                            ctx.lineWidth = this.brushSize;
                        }

                        ctx.beginPath();
                        ctx.moveTo(this.lastX, this.lastY);
                        ctx.lineTo(coords.x, coords.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    ctx.restore();

                    this.lastX = coords.x;
                    this.lastY = coords.y;
                    this.updateLayerUI();
                } else if (['line', 'rect', 'circle'].includes(this.currentTool)) {
                    layer.ctx.clearRect(0, 0, this.width, this.height);
                    layer.ctx.drawImage(this.tempCanvas, 0, 0);

                    layer.ctx.save();
                    layer.ctx.strokeStyle = this.primaryColor;
                    layer.ctx.lineWidth = this.brushSize;
                    layer.ctx.globalAlpha = this.brushOpacity;

                    if (this.currentTool === 'line') {
                        layer.ctx.beginPath();
                        layer.ctx.moveTo(this.startX, this.startY);
                        layer.ctx.lineTo(coords.x, coords.y);
                        layer.ctx.stroke();
                    } else if (this.currentTool === 'rect') {
                        layer.ctx.strokeRect(this.startX, this.startY, coords.x - this.startX, coords.y - this.startY);
                    } else if (this.currentTool === 'circle') {
                        const radiusX = Math.abs(coords.x - this.startX) / 2;
                        const radiusY = Math.abs(coords.y - this.startY) / 2;
                        const centerX = this.startX + (coords.x - this.startX) / 2;
                        const centerY = this.startY + (coords.y - this.startY) / 2;

                        layer.ctx.beginPath();
                        layer.ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);
                        layer.ctx.stroke();
                    }
                    layer.ctx.restore();
                }
            }

            onPointerUp() {
                if (this.isDrawing) {
                    this.isDrawing = false;
                    this.saveState();
                }
                if (this.isLayerMoving) {
                    this.isLayerMoving = false;
                    this.saveState();
                }
                if (this.isPanning) {
                    this.isPanning = false;
                }
            }

            pickColor(x, y) {
                const sampleCanvas = document.createElement('canvas');
                sampleCanvas.width = this.width;
                sampleCanvas.height = this.height;
                const sCtx = sampleCanvas.getContext('2d');

                this.layers.forEach(l => {
                    if (l.visible) {
                        sCtx.globalAlpha = l.opacity;
                        sCtx.globalCompositeOperation = l.blendMode;
                        sCtx.drawImage(l.canvas, 0, 0);
                    }
                });

                const pixel = sCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
                const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2, '0')).join('');
                this.setPrimaryColor(hex);
                this.showToast(`色を取得: ${hex.toUpperCase()}`);
            }

            floodFill(startX, startY) {
                const layer = this.getActiveLayer();
                if (!layer) return;

                const imgData = layer.ctx.getImageData(0, 0, this.width, this.height);
                const data = imgData.data;
                const targetIdx = (startY * this.width + startX) * 4;
                
                const targetR = data[targetIdx];
                const targetG = data[targetIdx + 1];
                const targetB = data[targetIdx + 2];
                const targetA = data[targetIdx + 3];

                const r = parseInt(this.primaryColor.slice(1, 3), 16);
                const g = parseInt(this.primaryColor.slice(3, 5), 16);
                const b = parseInt(this.primaryColor.slice(5, 7), 16);
                const a = Math.round(this.brushOpacity * 255);

                if (targetR === r && targetG === g && targetB === b && targetA === a) return;

                const queue = [[startX, startY]];
                const visited = new Uint8Array(this.width * this.height);

                while (queue.length > 0) {
                    const [x, y] = queue.pop();
                    if (x < 0 || x >= this.width || y < 0 || y >= this.height) continue;
                    
                    const idx = y * this.width + x;
                    if (visited[idx]) continue;
                    visited[idx] = 1;

                    const pIdx = idx * 4;
                    if (
                        Math.abs(data[pIdx] - targetR) <= 15 &&
                        Math.abs(data[pIdx + 1] - targetG) <= 15 &&
                        Math.abs(data[pIdx + 2] - targetB) <= 15 &&
                        Math.abs(data[pIdx + 3] - targetA) <= 15
                    ) {
                        data[pIdx] = r;
                        data[pIdx + 1] = g;
                        data[pIdx + 2] = b;
                        data[pIdx + 3] = a;

                        queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
                    }
                }

                layer.ctx.putImageData(imgData, 0, 0);
                this.updateLayerUI();
            }

            zoom(delta) {
                this.zoomLevel = Math.min(Math.max(0.1, this.zoomLevel + delta), 10.0);
                this.updateTransform();
                document.getElementById('zoom-level-indicator').innerText = Math.round(this.zoomLevel * 100) + '%';
                document.getElementById('canvas-info-zoom').innerText = Math.round(this.zoomLevel * 100) + '%';
            }

            rotateCanvas(angleDelta) {
                this.rotateAngle = (this.rotateAngle + angleDelta) % 360;
                this.updateTransform();
                document.getElementById('rotate-level-indicator').innerText = this.rotateAngle + '°';
            }

            resetView() {
                this.zoomLevel = 1.0;
                this.rotateAngle = 0;
                this.panX = 0;
                this.panY = 0;
                this.updateTransform();
                document.getElementById('zoom-level-indicator').innerText = '100%';
                document.getElementById('rotate-level-indicator').innerText = '0°';
                document.getElementById('canvas-info-zoom').innerText = '100%';
            }

            updateTransform() {
                this.container.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoomLevel}) rotate(${this.rotateAngle}deg)`;
            }

            saveState() {
                if (this.historyIndex < this.history.length - 1) {
                    this.history = this.history.slice(0, this.historyIndex + 1);
                }

                const state = this.layers.map(l => ({
                    id: l.id,
                    name: l.name,
                    opacity: l.opacity,
                    blendMode: l.blendMode,
                    visible: l.visible,
                    isPaper: l.isPaper,
                    dataURL: l.canvas.toDataURL()
                }));

                this.history.push(state);
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                } else {
                    this.historyIndex++;
                }
            }

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.restoreState(this.history[this.historyIndex]);
                    this.showToast('元に戻しました');
                }
            }

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.restoreState(this.history[this.historyIndex]);
                    this.showToast('やり直しました');
                }
            }

            restoreState(state) {
                this.layers.forEach(l => this.container.removeChild(l.canvas));
                this.layers = [];

                state.forEach(s => {
                    const canvas = document.createElement('canvas');
                    canvas.width = this.width;
                    canvas.height = this.height;
                    canvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
                    canvas.style.display = s.visible ? 'block' : 'none';
                    canvas.style.opacity = s.opacity;
                    canvas.style.mixBlendMode = s.blendMode;

                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0);
                        this.updateLayerUI();
                    };
                    img.src = s.dataURL;

                    this.container.appendChild(canvas);

                    this.layers.push({
                        id: s.id,
                        name: s.name,
                        canvas,
                        ctx,
                        visible: s.visible,
                        opacity: s.opacity,
                        blendMode: s.blendMode,
                        isPaper: s.isPaper
                    });
                });

                if (this.layers.length > 0) {
                    this.activeLayerId = this.layers[this.layers.length - 1].id;
                }
                this.updateLayerOrderDOM();
                this.updateLayerUI();
            }

            newCanvas() {
                document.getElementById('new-canvas-modal').classList.remove('hidden');
            }

            closeNewCanvasModal() {
                document.getElementById('new-canvas-modal').classList.add('hidden');
            }

            confirmNewCanvas() {
                const w = parseInt(document.getElementById('modal-width').value) || 1000;
                const h = parseInt(document.getElementById('modal-height').value) || 1000;
                this.closeNewCanvasModal();
                this.createNewCanvas(w, h);
            }

            exportImage(format) {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = this.width;
                exportCanvas.height = this.height;
                const eCtx = exportCanvas.getContext('2d');

                if (format === 'jpeg') {
                    eCtx.fillStyle = '#ffffff';
                    eCtx.fillRect(0, 0, this.width, this.height);
                }

                this.layers.forEach(l => {
                    if (l.visible) {
                        eCtx.globalAlpha = l.opacity;
                        eCtx.globalCompositeOperation = l.blendMode;
                        eCtx.drawImage(l.canvas, 0, 0);
                    }
                });

                const link = document.createElement('a');
                link.download = `clip-studio-artwork.${format}`;
                link.href = exportCanvas.toDataURL(`image/${format}`, 0.95);
                link.click();

                this.showToast(`画像 (${format.toUpperCase()}) を保存しました`);
            }

            toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }

            showToast(message, isError = false) {
                const toast = document.getElementById('toast-message');
                const text = document.getElementById('toast-text');
                text.innerText = message;
                toast.classList.remove('translate-y-20', 'opacity-0');
                if (isError) {
                    toast.classList.add('border-red-500');
                } else {
                    toast.classList.remove('border-red-500');
                }
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }
        }

        let app;
        window.onload = () => {
            app = new ClipStudioApp();
        };

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) {
                    app.redo();
                } else {
                    app.undo();
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                app.redo();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                app.exportImage('png');
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                app.newCanvas();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
                e.preventDefault();
                document.getElementById('image-upload-input').click();
            }
        });
    </script>
</body>
</html>
